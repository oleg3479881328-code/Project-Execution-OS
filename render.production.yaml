# Durable paid-production Blueprint reference for Website Creator Engine.
# This file is intentionally NOT Render's default Blueprint filename so paid resources are never created accidentally.
services:
  - type: web
    name: website-creator-engine-production
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    rootDir: projects/website-creation/engine
    healthCheckPath: /health
    disk:
      name: website-creator-media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: website-creator-postgres-production
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: MEDIA_DIR
        value: /app/media

databases:
  - name: website-creator-postgres-production
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
