name: Website Creator Engine

on:
  push:
    paths:
      - 'projects/website-creation/engine/**'
      - '.github/workflows/website-creator-engine.yml'
  pull_request:
    paths:
      - 'projects/website-creation/engine/**'
      - '.github/workflows/website-creator-engine.yml'

jobs:
  build-and-runtime-smoke:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/website-creation/engine

    env:
      CSG_GITHUB_MODE: '1'
      CSG_GITHUB_API_BASE_URL: http://127.0.0.1:4010
      CSG_GITHUB_TOKEN: ci-mock-github-token
      CSG_EDITOR_USERNAME: editor
      CSG_EDITOR_PASSWORD: ci-editor-password
      CSG_EDITOR_SESSION_SECRET: ci-editor-session-secret
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: projects/website-creation/engine/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start engine and run browser acceptance
        run: |
          pnpm exec playwright test
      - name: Upload browser and migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-creator-car-garage-evidence
          path: |
            projects/website-creation/engine/test-results/
            projects/website-creation/engine/src/migrations/
          if-no-files-found: ignore
