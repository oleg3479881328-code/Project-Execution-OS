name: Refresh system index

on:
  push:
    branches: ["main"]
    paths:
      - "blocks/**"
      - "docs/**"
      - "knowledge-library/**"
      - "skills/**"
      - "agent-library/**"
      - "projects/**"
      - "scripts/build_system_index.py"
      - "scripts/validate_system_index_v3.py"
      - ".github/workflows/system-index.yml"
      - "PROJECT_INDEX.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild generated indexes
        run: python scripts/build_system_index.py

      - name: Validate generated indexes
        run: python scripts/validate_system_index_v3.py

      - name: Commit refreshed indexes
        run: |
          if git diff --quiet -- indexes; then
            echo "Generated indexes are already current."
            exit 0
          fi
          git config user.name "project-execution-os-indexer"
          git config user.email "actions@users.noreply.github.com"
          git add indexes
          git commit -m "Refresh generated system indexes [skip ci]"
          git push
