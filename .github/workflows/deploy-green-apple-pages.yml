name: Deploy Green Apple Landing to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'projects/20260516-green-apple/site/**'
      - '.github/workflows/deploy-green-apple-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: green-apple-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Green Apple site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/20260516-green-apple/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
