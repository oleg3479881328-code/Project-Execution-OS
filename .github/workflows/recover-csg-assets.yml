name: Recover Car Service Garage approved assets

on:
  push:
    branches:
      - fix/csg-preflight-assets-storage-20260929
    paths:
      - '.github/workflows/recover-csg-assets.yml'

permissions:
  contents: write

jobs:
  recover-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csg-preflight-assets-storage-20260929
          fetch-depth: 0
      - name: Download approved donor assets from the last known-good Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://car-service-garage-ohio-q4uzoh0ky-oleg3479881328-codes-projects.vercel.app/assets'
          out='projects/website-creation/engine/public/assets'
          mkdir -p "$out"
          for name in hero diagnostics brakes suspension oil electrical major; do
            curl --fail --location --silent --show-error "$base/$name.webp" -o "$out/$name.webp"
            test -s "$out/$name.webp"
            file "$out/$name.webp"
          done
          sha256sum "$out"/*.webp
      - name: Commit recovered assets to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/website-creation/engine/public/assets/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Recover approved Car Service Garage assets [skip ci]'
          git push origin HEAD:fix/csg-preflight-assets-storage-20260929
