name: Recover Car Service Garage approved assets

on:
  push:
    branches:
      - fix/csg-preflight-assets-storage-20260929
    paths:
      - '.github/workflows/recover-csg-assets.yml'

permissions:
  contents: write

jobs:
  recover-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csg-preflight-assets-storage-20260929
          fetch-depth: 0
      - name: Download approved donor assets from the last known-good Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          origin='https://car-service-garage-ohio-q4uzoh0ky-oleg3479881328-codes-projects.vercel.app'
          share='https://car-service-garage-ohio-q4uzoh0ky-oleg3479881328-codes-projects.vercel.app/?_vercel_share=e3jAblgIZk0vyjBoz5ZBxhiGvdaF7kV9'
          out='projects/website-creation/engine/public/assets'
          cookies="${RUNNER_TEMP}/vercel-cookies.txt"
          mkdir -p "$out"

          curl --fail --location --silent --show-error --cookie-jar "$cookies" "$share" -o "${RUNNER_TEMP}/share-bootstrap.html"

          for name in hero diagnostics brakes suspension oil electrical major; do
            target="$out/$name.webp"
            curl --fail --location --silent --show-error --cookie "$cookies" "$origin/assets/$name.webp" -o "$target"
            test -s "$target"
            python -c "import pathlib,sys; p=pathlib.Path(sys.argv[1]); d=p.read_bytes(); assert len(d)>=12 and d[:4]==b'RIFF' and d[8:12]==b'WEBP', f'Not a WebP binary: {p} ({len(d)} bytes)'; print(f'VERIFIED WEBP {p} {len(d)} bytes')" "$target"
          done
          sha256sum "$out"/*.webp
      - name: Commit recovered assets to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/website-creation/engine/public/assets/*.webp
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Recover verified Car Service Garage WebP assets [skip ci]'
          git push origin HEAD:fix/csg-preflight-assets-storage-20260929
