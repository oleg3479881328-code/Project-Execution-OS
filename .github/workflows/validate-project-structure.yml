name: Validate Project OS Integrity

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-project-structure:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project structure
        shell: pwsh
        run: ./scripts/validate-project-structure.ps1

      - name: Validate router integrity
        if: always()
        shell: pwsh
        run: ./scripts/validate-router-integrity.ps1

      - name: Validate system context manifest
        if: always()
        shell: pwsh
        run: ./scripts/validate-system-context-manifest.ps1

      - name: Validate completion contract
        if: always()
        shell: pwsh
        run: ./scripts/validate-completion-contract.ps1

      - name: Verify hygiene persistence escalation
        if: always()
        shell: pwsh
        run: python ./scripts/test_hygiene_persistence.py

      - name: Audit system hygiene
        if: always()
        shell: pwsh
        run: python ./scripts/audit_system_hygiene.py

      - name: Record scheduled hygiene trend
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: python ./scripts/audit_system_hygiene.py --record-history

      - name: Commit hygiene trend history
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          if (git diff --quiet -- logs/hygiene-history.jsonl) {
            Write-Host "Hygiene history is unchanged."
            exit 0
          }
          git config user.name "project-execution-os-hygiene"
          git config user.email "actions@users.noreply.github.com"
          git add logs/hygiene-history.jsonl
          git commit -m "Record weekly system hygiene trend [skip ci]"
          git push
