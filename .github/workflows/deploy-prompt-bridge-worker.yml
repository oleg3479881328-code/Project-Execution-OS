name: Deploy Prompt Bridge Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prompt-bridge-worker/**'
      - '.github/workflows/deploy-prompt-bridge-worker.yml'

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: prompt-bridge-worker
          command: deploy
