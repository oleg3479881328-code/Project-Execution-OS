name: TikTok Research Sorter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'projects/tiktok-research-sorter/**'
  pull_request:
    branches:
      - main
    paths:
      - 'projects/tiktok-research-sorter/**'
  workflow_dispatch:
    inputs:
      build-only:
        description: 'Only run build (skip tests)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: projects/tiktok-research-sorter

jobs:
  validate:
    name: Validate, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/tiktok-research-sorter/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        if: ${{ !inputs.build-only }}
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-research-sorter-chrome-mv3
          path: projects/tiktok-research-sorter/.output/chrome-mv3/
          retention-days: 7
          if-no-files-found: error

  package:
    name: Package as ZIP
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: tiktok-research-sorter-chrome-mv3
          path: chrome-mv3

      - name: Create ZIP archive
        run: |
          cd chrome-mv3
          zip -r ../tiktok-research-sorter.zip .

      - name: Upload ZIP as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-research-sorter-zip
          path: tiktok-research-sorter.zip
          retention-days: 30
          if-no-files-found: error
