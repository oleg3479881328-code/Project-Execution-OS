services:
  - type: web
    name: website-creator-engine
    runtime: docker
    plan: free
    region: ohio
    rootDir: projects/website-creation/engine
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: website-creator-postgres
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true
      - key: WC_ADMIN_EMAIL
        sync: false
      - key: WC_ADMIN_PASSWORD
        sync: false

databases:
  - name: website-creator-postgres
    plan: free
    region: ohio
