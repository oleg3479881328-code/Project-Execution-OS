# Free staging Blueprint for Website Creator Engine.
# Render Free Postgres expires after 30 days. Use render.production.yaml for durable production.
services:
  - type: web
    name: website-creator-engine
    runtime: docker
    plan: free
    region: ohio
    rootDir: projects/website-creation/engine
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: website-creator-postgres
          property: connectionString
      - key: PAYLOAD_SECRET
        generateValue: true

databases:
  - name: website-creator-postgres
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []
