services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: website_creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-website_creator_dev}
      POSTGRES_DB: website_creator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website_creator -d website_creator"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - website_creator_postgres:/var/lib/postgresql/data

  website-creator:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://website_creator:${POSTGRES_PASSWORD:-website_creator_dev}@postgres:5432/website_creator
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-secret-change-before-production}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      WC_ADMIN_EMAIL: ${WC_ADMIN_EMAIL:-admin@website-creator.local}
      WC_ADMIN_PASSWORD: ${WC_ADMIN_PASSWORD:-change-me-now}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  website_creator_postgres:
